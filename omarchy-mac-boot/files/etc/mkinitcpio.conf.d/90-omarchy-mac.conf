# Both firmware hooks are needed when 91 moves an inherited asahi line to
# systemd. Check them independently, including hooks later in the line.
# A busybox encrypt line stays busybox and uses asahi's runtime hook.
_omarchy_asahi_missing=()
for _omarchy_asahi_hook in asahi omarchy-vendorfw; do
  if [[ $_omarchy_asahi_hook == "omarchy-vendorfw" && " ${HOOKS[*]} " == *" encrypt "* &&
    " ${HOOKS[*]} " != *" systemd "* ]]; then
    continue
  fi
  if [[ " ${HOOKS[*]} " != *" $_omarchy_asahi_hook "* ]]; then
    _omarchy_asahi_missing+=("$_omarchy_asahi_hook")
  fi
done
_omarchy_asahi_hooks=()
_omarchy_asahi_added=false
for _omarchy_asahi_hook in "${HOOKS[@]}"; do
  if [[ $_omarchy_asahi_hook == "filesystems" && $_omarchy_asahi_added == "false" ]]; then
    _omarchy_asahi_hooks+=("${_omarchy_asahi_missing[@]}")
    _omarchy_asahi_added=true
  fi
  _omarchy_asahi_hooks+=("$_omarchy_asahi_hook")
done
if [[ $_omarchy_asahi_added == "false" ]]; then
  _omarchy_asahi_hooks+=("${_omarchy_asahi_missing[@]}")
fi
HOOKS=("${_omarchy_asahi_hooks[@]}")
unset _omarchy_asahi_missing _omarchy_asahi_hooks _omarchy_asahi_hook _omarchy_asahi_added
